<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f3">
  <title>Update tether.</title>
  <style>
    :root{font:16px system-ui,-apple-system,sans-serif;color:#263d30;background:#f6f7f3;color-scheme:light dark}
    *{box-sizing:border-box}body{margin:0;padding:max(28px,env(safe-area-inset-top)) 24px}
    main{max-width:440px;margin:12vh auto;line-height:1.6}h1{font-size:30px;font-weight:650;letter-spacing:-1px;margin:0 0 24px}
    p{margin:12px 0}.muted{color:#647467;font-size:14px}button,a{font:inherit;border-radius:9px;padding:10px 16px;display:inline-block}
    button{background:#38634e;color:white;border:0;cursor:pointer}a{color:inherit}button[hidden]{display:none}
    @media(prefers-color-scheme:dark){:root{background:#19201c;color:#e6eee8}.muted{color:#abb9af}}
  </style>
</head>
<body>
  <main data-version="__VERSION__">
    <h1>tether.</h1>
    <p id="status" role="status">Checking for the latest version…</p>
    <p class="muted">Your tasks, notes, conversation, and saved connection stay on this device.</p>
    <button id="retry" type="button" hidden>Try again</button>
    <a href="./">Return to tether</a>
  </main>
  <script>
  (()=>{
    const base=new URL('./',location.href),status=document.querySelector('#status'),retry=document.querySelector('#retry');
    const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    // Read only. Never create, upgrade, remove, or rewrite the user's database.
    async function busy(){
      return new Promise((resolve,reject)=>{
        let absent=false;const request=indexedDB.open('tether-chat-web:'+base.pathname);
        request.onupgradeneeded=()=>{absent=true;request.transaction.abort()};
        request.onerror=()=>absent?resolve(false):reject(Error('Could not check saved requests. Return to tether, then try updating again.'));
        request.onsuccess=()=>{
          const db=request.result;
          if(!db.objectStoreNames.contains('state')){db.close();resolve(false);return}
          const transaction=db.transaction('state','readonly'),read=transaction.objectStore('state').get('data');let active=false;
          read.onsuccess=()=>{active=(read.result?.jobs||[]).some(job=>['running','queued'].includes(job.status) &&
            Date.parse(job.updated_at||job.created_at)>Date.now()-120000)};
          transaction.oncomplete=()=>{db.close();resolve(active)};
          transaction.onerror=()=>{db.close();reject(Error('Could not check saved requests. Return to tether, then try updating again.'))};
        };
      });
    }
    async function download(){
      if(!('serviceWorker' in navigator)){location.replace(base.href);return}
      status.textContent='Downloading the latest tether version…';
      let registration;
      try{
        registration=await navigator.serviceWorker.register(new URL('sw.js',base),{scope:base.pathname,updateViaCache:'none'});
        await registration.update();
      }catch(_){throw Error('Could not download the update. Check your internet connection and try again.')}
      const deadline=Date.now()+60000;
      let installing=registration.installing;
      while(registration.installing){
        installing=registration.installing;
        if(Date.now()>deadline)throw Error('The update is taking longer than expected. Check your internet connection and try again.');
        if(registration.installing.state==='redundant')throw Error('The update could not finish downloading. Your saved data is unchanged. Try again.');
        await sleep(100);
      }
      if(installing?.state==='redundant')throw Error('The update could not finish downloading. Your saved data is unchanged. Try again.');
      const worker=registration.waiting;
      if(worker){
        status.textContent='Applying the update…';
        await new Promise((resolve,reject)=>{
          const previous=navigator.serviceWorker.controller;
          const done=()=>{if(navigator.serviceWorker.controller!==previous){clearTimeout(timeout);navigator.serviceWorker.removeEventListener('controllerchange',done);resolve()}};
          const timeout=setTimeout(()=>{navigator.serviceWorker.removeEventListener('controllerchange',done);reject(Error('The update is ready but could not open. Try again.'))},20000);
          navigator.serviceWorker.addEventListener('controllerchange',done);
          worker.postMessage({type:'TETHER_ACTIVATE_UPDATE'});done();
        });
      }
      status.textContent='Opening updated tether…';location.replace(base.href);
    }
    async function run(){
      retry.hidden=true;
      try{
        while(true){
          if(await busy()){status.textContent='Waiting for your current chat request to finish before updating…';await sleep(1000);continue}
          if(navigator.locks){
            const updated=await navigator.locks.request('tether-chat-web-queue:'+base.pathname,{ifAvailable:true},async lock=>{
              if(!lock)return false;
              if(await busy())return false;
              await download();return true;
            });
            if(updated)return;
            status.textContent='Waiting for your current chat request to finish before updating…';await sleep(1000);
          }else{await download();return}
        }
      }catch(error){status.textContent=error.message||'Could not download the update. Check your connection and try again.';retry.hidden=false}
    }
    retry.onclick=run;run();
  })();
  </script>
</body>
</html>
