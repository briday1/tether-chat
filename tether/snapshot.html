<script>
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search);
document.documentElement.dataset.density=params.get('density')==='comfortable'?'comfortable':'compact';
const palette=['#3279c7','#bd4a69','#478d57','#b87527','#8058bc','#168d99','#c0523e','#6b7d27','#a33d9d','#5079a4','#aa7746','#318575','#865b49','#98547e','#567bb9','#a65b28','#658742','#8560aa','#b64e52','#3f8ba9','#8c7332','#4e9180','#b06b86','#636bb4'];
const names=t=>t.categories?.length?t.categories:[t.category||'Unsorted'];
function color(name){let hash=0;for(const char of name.toLowerCase())hash=(Math.imul(hash,31)+char.charCodeAt(0))>>>0;return palette[hash%palette.length]}
const dateOnly=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
window.addEventListener('message',event=>{
 if(parent===window||event.source!==parent||event.origin!==location.origin||event.data?.type!=='tether:snapshot-theme')return;
 const variables=event.data.variables||{};
 if(typeof variables.paper==='string')document.documentElement.style.setProperty('--calendar-task-base',variables.paper);

 for(const name of ['page','paper','panel','text','muted','line','soft','accent','accent-text','highlight']){
  if(typeof variables[name]==='string')document.documentElement.style.setProperty('--'+name,variables[name]);
 }
});

let restoringFocus=false;
let last=null,loadRevision=0,lastSignature='',selected=null,selectionRevision=0,returnTimer=null,lastInteraction=0,panelSignature='';
const dayLabel=date=>new Date(date+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
const allItems=data=>[...(data?.tasks||[]).map(task=>({task,activity:false})),...(data?.activity||[]).map(task=>({task,activity:true}))];
function notifyHeight(){if(parent!==window)parent.postMessage({type:'tether:snapshot-size',height:Math.ceil($('.shell').getBoundingClientRect().height)},location.origin)}
new ResizeObserver(notifyHeight).observe($('.shell'));
function scheduleReturn(){clearTimeout(returnTimer);if(!selected||$('#task-detail').open)return;lastInteraction=Date.now();returnTimer=setTimeout(()=>{selected=null;selectionRevision++;panelSignature='';renderPanel();markSelected()},15000)}
function markSelected(){for(const cell of document.querySelectorAll('.day'))cell.classList.toggle('selected',cell.dataset.date===(selected||dateOnly(new Date())))}
function selectDate(date){if(restoringFocus)return;if(selected!==date){selected=date;selectionRevision++;panelSignature='';renderPanel();markSelected()}scheduleReturn()}
function categoryLabels(parent,t){const span=document.createElement('span');span.className='task-categories';span.textContent=names(t).join(' · ');parent.append(span)}
function scheduleDay(value){if(!value)return '';if(/^\d{4}-\d\d-\d\d$/.test(value))return value;const d=new Date(value);return Number.isFinite(+d)?dateOnly(d):''}
function timing(t){const occurrence=t.occurrence_at?'occurrence_at':'next_occurrence';return [['due_at','Due'],['revisit_at','Attention'],[occurrence,t.occurrence_at?'Occurrence':'Next occurrence']].filter(([key])=>t[key]&&(!t.date||scheduleDay(t[key])===t.date)).map(([key,label])=>label+' '+formatWhen(t[key])).join(' · ')}
function formatWhen(value){if(/^\d{4}-\d\d-\d\d$/.test(value))return dayLabel(value);const d=new Date(value);return Number.isFinite(+d)?d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):String(value)}
function line(parent,text,css='task-context'){if(!text)return;const span=document.createElement('span');span.className=css;span.textContent=text;parent.append(span)}
function taskCard(t,activity=false,asButton=false,date=null){const item=document.createElement(activity&&!asButton?'article':'button');item.className='task'+(activity?' activity':'');item.style.setProperty('--task-color',color(names(t)[0]));const title=document.createElement('span');title.className='task-title';title.textContent=activity?t.body:t.title;item.append(title);if(activity||t.schedule_label)line(item,activity?[t.title,t.kind].filter(Boolean).join(' · '):t.state==='settled'?'Done':timing(t)?'':t.schedule_label,'activity-label');if(!activity){line(item,timing(t));line(item,t.location?'Location: '+t.location:'');line(item,t.summary||t.note_preview,'task-preview')}categoryLabels(item,t);if(asButton)item.onclick=()=>selectDate(date);else if(!activity){item.type='button';item.setAttribute('aria-haspopup','dialog');item.onclick=()=>openDetail(t,item)}return item}
// A reload starts with the calendar, not an orphaned modal history entry.
if(history.state?.tetherSnapshotDetail){const state={...history.state};delete state.tetherSnapshotDetail;history.replaceState(state,'',location.href);if(parent!==window)parent.postMessage({type:'tether:snapshot-detail',open:false},location.origin)}
const parentOwnsDetail=parent!==window&&params.get('layout')==='display';
const detail=$('#task-detail');let detailTask=null,detailTrigger=null,detailRevision=0,detailClosing=false;
function detailSignal(open){if(parent!==window)parent.postMessage({type:'tether:snapshot-detail',open},location.origin)}
function detailSection(label,value){if(!value)return;const h=document.createElement('h3'),p=document.createElement('p');h.textContent=label;p.textContent=value;$('#task-detail-body').append(h,p)}
function showDetail(t,full=null){$('#task-detail-title').textContent=t.title;$('#task-detail-body').replaceChildren();const action=full?.entries?.find(e=>e.id===t.action_id),record=action||full||t;detailSection('Task',t.action_id?t.task_title:'');detailSection('Schedule',timing(t));detailSection('Repeats',t.recurrence? t.recurrence+(t.recurrence_end?' through '+dayLabel(t.recurrence_end)+' (inclusive)':''): '');detailSection('Status',action?(action.done?'Finished':'Active'):({open:'Active',waiting:'Blocked / waiting',paused:'Set aside',settled:'Finished'}[record.state]||record.state));detailSection('Categories',names(full||t).join(' · '));detailSection('Location',t.location);detailSection('Details',full?.summary||t.summary);const notes=action? action.notes : full?.entries?.filter(e=>e.kind!=='action');if(notes?.length){detailSection(action?'Action notes':'Notes',notes.map(n=>n.body).join('\n\n'))}else if(!full)detailSection('Note',t.note_preview)}
async function openDetail(t,trigger=null,push=true){if(detailClosing)return;detailTask=t;detailTrigger=trigger||detailTrigger;clearTimeout(returnTimer);if(parentOwnsDetail&&push){parent.postMessage({type:'tether:snapshot-detail-request',action:'open',task:t},location.origin);return}if(push)history.pushState({...history.state,tetherSnapshotDetail:t},'',location.href);showDetail(t);if(!detail.open)detail.showModal();detailSignal(true);$('#task-detail-close').focus();const revision=++detailRevision;try{const response=await fetch('/api/threads/'+encodeURIComponent(t.task_id||t.id));if(!response.ok)throw Error('Task details unavailable');const full=await response.json();if(revision===detailRevision&&detail.open)showDetail(t,full)}catch(_){if(revision===detailRevision&&detail.open){const p=document.createElement('p');p.className='detail-error';p.textContent='Could not load the latest details. Showing saved calendar information.';$('#task-detail-body').append(p)}}}
function dismissDetail(){if(!detail.open&&!detailClosing)return;detailRevision++;if(detail.open)detail.close();detailSignal(false);if(detailTrigger?.isConnected)detailTrigger.focus({preventScroll:true});else $('#date-panel-items').focus({preventScroll:true});scheduleReturn();queueMicrotask(()=>{if(!detail.open&&!detailClosing)load()})}
function closeDetail(){if(detailClosing)return;if(parentOwnsDetail){detailClosing=true;parent.postMessage({type:'tether:snapshot-detail-request',action:'close'},location.origin);return}if(history.state?.tetherSnapshotDetail){detailClosing=true;detailRevision++;history.back()}else dismissDetail()}
// Handle Escape in this document as well as native dialog cancellation.
// Embedded close-watchers are not consistent after focus/viewport changes.
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&detail.open){event.preventDefault();event.stopPropagation();closeDetail()}},true);
$('#task-detail-close').onclick=closeDetail;detail.addEventListener('cancel',event=>{event.preventDefault();closeDetail()});detail.addEventListener('click',event=>{if(event.target===detail){const r=detail.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDetail()}});
window.addEventListener('popstate',()=>{if(parentOwnsDetail)return;if(history.state?.tetherSnapshotDetail){detailClosing=false;openDetail(history.state.tetherSnapshotDetail,null,false)}else{dismissDetail();detailClosing=false}});

async function renderPanel(force=false){
 if(detail.open)return;
 const date=selected||dateOnly(new Date()),request=++selectionRevision,panel=$('#date-panel'),items=$('#date-panel-items'),changed=panel.dataset.date!==date,oldScroll=changed?0:items.scrollTop;if(changed){items.textContent='Loading date…';items.scrollTop=0}panel.dataset.date=date;$('#date-panel-title').textContent=date===dateOnly(new Date())?'Today':new Date(date+'T12:00:00').toLocaleDateString(undefined,{weekday:'long'});$('#date-panel-date').textContent=dayLabel(date);
 let data=(last?.days||[]).find(day=>day.date===date);
 if(!data){try{const query=new URLSearchParams({start:date,end:date});if(params.get('category'))query.set('category',params.get('category'));const response=await fetch('/api/snapshot?'+query);if(!response.ok)throw Error('Date details unavailable');const result=await response.json();data=result.days?.find(day=>day.date===date)||{date,tasks:[],activity:[]}}catch(_){if(request!==selectionRevision||detail.open)return;panelSignature='';$('#date-panel-items').textContent='Could not load this date. It will retry on refresh.';return}}
 if(request!==selectionRevision||detail.open)return;
 const signature=date+JSON.stringify(data);if(!force&&signature===panelSignature)return;panelSignature=signature;items.replaceChildren();for(const {task,activity} of allItems(data))items.append(taskCard(task,activity));if(!items.childElementCount){const empty=document.createElement('p');empty.className='date-panel-empty';empty.textContent='No scheduled items.';items.append(empty)}items.scrollTop=oldScroll;notifyHeight();
}
for(const event of ['pointerdown','pointermove','wheel','keydown','click'])$('#date-panel').addEventListener(event,e=>{if(selected&&(e.type!=='pointermove'||e.movementX||e.movementY))scheduleReturn()},{passive:true});
$('#date-panel-items').addEventListener('scroll',()=>{if(selected)scheduleReturn()},{passive:true});
function render(data){
 if(detail.open)return;
 last=data;const signature=JSON.stringify(data)+dateOnly(new Date());if(signature===lastSignature){renderPanel();return}lastSignature=signature;
 const all=data.days||[],single=all.length===1,month=all.length>7,dashboard=params.get('layout')==='display',compact=month||dashboard;
 const weekends=all.some(d=>new Date(d.date+'T12:00:00').getDay()%6===0&&allItems(d).length);
 const cols=single?1:(compact||weekends)?7:5,weekStart=data.week_start??1,order=Array.from({length:7},(_,i)=>(weekStart+i)%7).filter(d=>cols===7||d>0&&d<6);
 const first=new Date(data.start+'T12:00:00'),end=new Date(data.end+'T12:00:00'),format=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
 $('#range').textContent=single?dayLabel(data.start):format(first)+' – '+format(end)+', '+end.getFullYear();
 const grid=$('#grid'),headers=$('#weekdays'),focused=document.activeElement,focusedCell=focused?.closest('.day'),focusDate=focusedCell?.dataset.date,focusIndex=focusedCell?[...focusedCell.querySelectorAll('button')].indexOf(focused):-1;grid.replaceChildren();headers.replaceChildren();$('.sheet').style.setProperty('--cols',cols);grid.className='grid '+(single?'single':month||dashboard?'month':'week');headers.hidden=single;
 for(const name of order.map(d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d])){const span=document.createElement('span');span.textContent=name;headers.append(span)}
 const begin=new Date(first),finish=new Date(end);if(!single){begin.setDate(begin.getDate()-(begin.getDay()-weekStart+7)%7);finish.setDate(finish.getDate()+6-(finish.getDay()-weekStart+7)%7)}
 const lookup=new Map(all.map(d=>[d.date,d]));
 for(let date=new Date(begin);date<=finish;date.setDate(date.getDate()+1)){
  if(cols===5&&(date.getDay()===0||date.getDay()===6))continue;
  const iso=dateOnly(date),d=lookup.get(iso),records=allItems(d),cell=document.createElement('div');cell.className='day'+(d?'':' outside')+(iso===dateOnly(new Date())?' today':'');cell.dataset.date=iso;
  const number=document.createElement('div');number.className='day-number';const dateButton=document.createElement('button');dateButton.className='day-date';dateButton.setAttribute('aria-controls','date-panel');if(iso===dateOnly(new Date()))dateButton.setAttribute('aria-current','date');dateButton.textContent=date.getDate();dateButton.setAttribute('aria-label',dayLabel(iso));dateButton.onclick=()=>selectDate(iso);number.append(dateButton);cell.append(number);
  cell.addEventListener('click',()=>selectDate(iso));
  const items=document.createElement('div');items.className='day-items';
  for(const {task,activity} of (compact?records.slice(0,3):records)){if(compact){const marker=document.createElement('button');marker.className='task-marker';marker.style.setProperty('--task-color',color(names(task)[0]));marker.style.setProperty('--marker-width',(65+(color(names(task)[0]).charCodeAt(2)%30))+'%');marker.setAttribute('aria-label',(activity?task.body:task.title)+' · '+dayLabel(iso));marker.onclick=()=>selectDate(iso);items.append(marker)}else items.append(taskCard(task,activity,true,iso))}cell.append(items);
  if(compact&&records.length>3){const more=document.createElement('button');more.className='day-more';more.textContent='+'+(records.length-3)+' more';more.setAttribute('aria-label','Show all '+records.length+' items on '+dayLabel(iso));more.onclick=()=>selectDate(iso);cell.append(more)}grid.append(cell);
 }

}
async function load(){if(detail.open)return;const request=++loadRevision;try{const prefs=await fetch('/api/preferences').then(r=>r.ok?r.json():({week_start:1}));const monday=new Date();monday.setDate(monday.getDate()-(monday.getDay()-(prefs.week_start??1)+7)%7);const sunday=new Date(monday);sunday.setDate(sunday.getDate()+6);const query=new URLSearchParams({start:params.get('start')||dateOnly(monday),end:params.get('end')||dateOnly(sunday)});if(params.get('category'))query.set('category',params.get('category'));const response=await fetch('/api/snapshot?'+query);if(!response.ok)throw Error('Could not load this calendar');const data=await response.json();if(request!==loadRevision)return;render(data);$('#error').textContent=''}catch(e){if(request===loadRevision)$('#error').textContent=e.message}}
window.addEventListener('message',event=>{
 if(parent===window||event.source!==parent||event.origin!==location.origin)return;
 if(event.data?.type==='tether:snapshot-refresh')load();

const refreshTimer=setInterval(()=>{if(!document.hidden&&!detail.open)load()},60000);
