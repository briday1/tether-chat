<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Display · tether.</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/display.css">
<script src="/theme.js"></script>
<script src="/workspace.js"></script>
</head>
<body class="display-dashboard">
<div class="display-bar"><button id="display-menu" aria-label="Switch view" aria-controls="display-sidebar" aria-expanded="false">☰</button><div class="display-month-navigation" role="group" aria-label="Month navigation"><button id="display-previous" aria-label="Previous month">‹</button><h1 id="display-title" aria-live="polite">Calendar</h1><button id="display-next" aria-label="Next month">›</button><button id="display-today">Today</button></div><time id="display-clock"><span id="display-clock-date"></span><span id="display-clock-time"></span></time><button id="display-settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h4l.6 2.3 1.7.9 2.2-.7 2 3.5-1.7 1.7v2l1.7 1.7-2 3.5-2.2-.7-1.7.9L14 20h-4l-.6-2.3-1.7-.9-2.2.7-2-3.5L5.2 12v-2L3.5 8.3l2-3.5 2.2.7 1.7-.9z"/><circle cx="12" cy="11" r="3"/></svg></button></div>
<button id="display-backdrop" aria-label="Close navigation" hidden></button>
<aside id="display-sidebar" role="dialog" aria-modal="true" aria-label="Switch view" hidden>
 <div class="sidebar-heading"><strong>Switch view</strong><button id="display-close" aria-label="Close navigation">×</button></div>
 <nav aria-label="App navigation"><a href="/">Conversation</a><a href="/board">Tasks</a><a href="/display" data-display-nav aria-current="page">Display</a></nav>
 <p id="display-status" role="status" hidden></p>

</aside>
<main class="display-main">
 <section class="display-calendar" aria-label="Task calendar"><iframe id="display-calendar" title="Month calendar and date details"></iframe></section>
 <p id="display-sync" role="status" hidden></p>
 <p id="display-error" role="alert" hidden></p>
</main>
<dialog id="display-settings-dialog" aria-label="Settings"><iframe id="display-settings-frame" title="General settings"></iframe></dialog>
<script src="/display.js"></script>
<script src="/display-chat.js"></script>
</body>
</html>
