name: Refresh tether UI screenshots

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - README.md
      - tether/index.html
      - tether/board.html
      - tether/theme.css
      - tether/notes.css
      - tether/notes.js
      - tether/notes.py
      - tether/chat.js
      - tether/store.py
      - tether/mcp_server.py
      - tether/snapshot.html
      - tether/snapshots.py
      - tether/snapshot_intent.py
      - tether/snapshot_export.py
      - tether/app.py
      - scripts/capture_screenshots.py
      - .github/workflows/screenshots.yml

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tether and browser
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify Python syntax and tests
        run: |
          python -m compileall -q tether scripts tests
          python -m pytest -q
      - name: Capture representative screens
        run: python scripts/capture_screenshots.py
      - name: Commit screenshots if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh tether UI screenshot references"
            git push
          fi
