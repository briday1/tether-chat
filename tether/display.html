<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Display · tether.</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/display.css">
<script src="/theme.js"></script>
<script src="/workspace.js"></script>
</head>
<body class="display-dashboard">
<div class="display-bar"><button id="display-menu" aria-label="View settings and navigation" aria-controls="display-sidebar" aria-expanded="false">☰</button><h1 id="display-title">Calendar</h1><time id="display-clock"></time></div>
<button id="display-backdrop" aria-label="Close view settings" hidden></button>
<aside id="display-sidebar" role="dialog" aria-modal="true" aria-label="Display settings" hidden>
 <div class="sidebar-heading"><strong>Display</strong><button id="display-close" aria-label="Close view settings">✕</button></div>
 <div class="display-navigation"><button id="previous" aria-label="Previous period">‹</button><button id="today">Today</button><button id="next" aria-label="Next period">›</button></div>
 <label>Go to date <input id="display-date" type="date"></label>
 <label>Calendar text <select id="display-density"><option value="compact">Compact</option><option value="comfortable">Comfortable</option></select></label>
 <label>Theme <select class="theme-picker" data-theme-picker aria-label="Color theme"></select></label>
 <p id="display-status" role="status">Calendar refreshes every minute while open.</p>
 <p class="display-hint">Choose a date to see all its items. Calendar refresh does not use AI.</p>
 <nav aria-label="App navigation"><a href="/">Conversation</a><a href="/board">Tasks</a><a href="/display" data-display-nav aria-current="page">Display</a></nav>
</aside>
<main class="display-main">
 <section class="display-calendar" aria-label="Task calendar"><iframe id="display-calendar" title="Month calendar and date details"></iframe></section>
 <footer class="display-footer"><div class="display-quick" id="display-quick"></div><span id="display-sync" role="status"></span></footer>
 <p id="display-error" role="alert" hidden></p>
</main>
<script src="/display.js"></script>
</body>
</html>
