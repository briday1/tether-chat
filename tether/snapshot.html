<!doctype html>
<html lang="en"><meta charset="utf-8"><script src="/workspace.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tether calendar</title><link rel="stylesheet" href="/theme.css"><script src="/theme.js"></script>
<script>document.documentElement.toggleAttribute('data-embedded',new URLSearchParams(location.search).get('embed')==='1');document.documentElement.toggleAttribute('data-dashboard',new URLSearchParams(location.search).get('layout')==='display');</script>
<style>
*{box-sizing:border-box}:root{--calendar-task-base:var(--paper);background:transparent!important}body{margin:0;font:13px system-ui,-apple-system,sans-serif;color:var(--text);background:transparent!important}.shell{max-width:1200px;margin:auto}.calendar-head{font-size:12px;color:var(--muted);padding:2px 0 8px}.calendar-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(190px,27%);gap:12px;align-items:stretch}.calendar-month{min-width:0}.weekdays,.grid{display:grid;grid-template-columns:repeat(var(--cols,7),minmax(0,1fr));gap:5px}.weekdays[hidden]{display:none}.weekdays span{font-size:10px;color:var(--muted);padding:2px 4px 6px}.day{border:1px solid var(--line);border-radius:5px;padding:5px;min-width:0;height:108px;overflow:hidden;background:transparent;display:flex;flex-direction:column}.day.outside{opacity:.5}.day.today .day-date{color:var(--accent);font-weight:750}.day.selected{border-color:var(--accent)}.day-number{flex:none;margin-bottom:5px}.day-date{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:2px;min-width:24px;text-align:left}.day-items{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:5px}.task-marker{height:8px;min-height:8px;width:var(--marker-width,90%);border:0;border-radius:3px;background:var(--task-color);opacity:.8;padding:0;cursor:pointer}.day-more{border:0;background:none;padding:5px 0 0;text-align:left;color:var(--muted);font:11px system-ui;cursor:pointer;min-height:23px}.task{font:12px/1.45 system-ui;color:var(--text);background:color-mix(in srgb,var(--task-color) 12%,var(--calendar-task-base));border:0;border-left:3px solid var(--task-color);border-radius:4px;padding:8px;text-align:left;overflow-wrap:anywhere;min-width:0}.task-title{font-weight:600;display:block;white-space:pre-wrap}.task-categories,.activity-label{display:block;font-size:10px;color:var(--muted);margin-top:4px}.grid.week .day,.grid.single .day{height:248px}.grid.week .day-items,.grid.single .day-items{overflow:auto}.grid.week .task,.grid.single .task{cursor:pointer;font-size:11px;padding:5px}.grid.week .task-title{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.grid.single .task-title{display:block}.date-panel{border-left:1px solid var(--line);padding:6px 0 6px 12px;min-height:0;display:flex;flex-direction:column;max-height:600px}.date-panel h2{font-size:18px;margin:0 0 5px;line-height:1.2}.date-panel-date,.date-panel-hint{font-size:11px;color:var(--muted);margin:0 0 10px}.date-panel-hint{margin:8px 0 0}.date-panel-items{overflow:auto;overscroll-behavior:contain;min-height:0;display:flex;flex-direction:column;gap:8px;flex:1;padding:2px}.date-panel .task{flex:none}.date-panel-empty{color:var(--muted);font-size:12px}.error:not(:empty){padding:8px;color:var(--text)}button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
:root[data-dashboard],:root[data-dashboard] body,:root[data-dashboard] .shell,:root[data-dashboard] .sheet{height:100%;overflow:hidden}:root[data-dashboard] .shell{max-width:none}:root[data-dashboard] .calendar-head{display:none}:root[data-dashboard] .calendar-layout{height:100%}:root[data-dashboard] .calendar-month{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}:root[data-dashboard] .grid{min-height:0;grid-template-rows:repeat(var(--rows,1),minmax(0,1fr))}:root[data-dashboard] .day{height:auto;min-height:0}:root[data-dashboard] .date-panel{max-height:none}:root[data-dashboard] .task-marker{height:10px;min-height:10px}:root[data-dashboard] .day-date{min-height:26px}
@media(max-width:620px){.calendar-layout{grid-template-columns:minmax(0,1fr);gap:9px}.date-panel{border-left:0;border-top:1px solid var(--line);padding:10px 0 0;max-height:240px;min-height:160px}.day{height:90px;padding:3px}.weekdays,.grid{gap:3px}.weekdays span{font-size:9px;padding-left:2px}.task-marker{height:7px;min-height:7px}.day-more{font-size:9px}.date-panel h2{font-size:16px}:root[data-dashboard] .calendar-layout{grid-template-rows:minmax(0,1fr) minmax(140px,30%)}:root[data-dashboard] .date-panel{min-height:0;max-height:none}:root[data-dashboard] .day{padding:2px}:root[data-dashboard] .day-date{min-height:20px;font-size:10px}:root[data-dashboard] .day-number{margin-bottom:3px}:root[data-dashboard] .day-items{gap:3px}:root[data-dashboard] .task-marker{height:6px;min-height:6px}:root[data-dashboard] .day-more{padding-top:2px;min-height:14px}}
:root[data-density="comfortable"] .date-panel .task{font-size:15px;padding:12px}:root[data-density="comfortable"] .date-panel .task-categories,:root[data-density="comfortable"] .date-panel .activity-label{font-size:12px}
@media(max-height:700px){:root[data-dashboard] .day{padding:2px}:root[data-dashboard] .day-date{min-height:18px;font-size:10px;padding:0}:root[data-dashboard] .day-number{margin-bottom:2px}:root[data-dashboard] .day-items{gap:2px}:root[data-dashboard] .task-marker{height:4px;min-height:4px}:root[data-dashboard] .day-more{padding-top:1px;min-height:13px;font-size:9px}}
</style>
<div class="shell"><div class="sheet" id="sheet"><div class="calendar-head" id="range"></div>
<div class="calendar-layout"><div class="calendar-month"><div class="weekdays" id="weekdays"></div><div class="grid" id="grid"></div></div>
<aside id="date-panel" class="date-panel" aria-label="Date details"><h2 id="date-panel-title" aria-live="polite" aria-atomic="true">Today</h2><p id="date-panel-date" class="date-panel-date"></p><div id="date-panel-items" class="date-panel-items" tabindex="0" aria-label="Tasks for selected date"></div><p id="date-panel-hint" class="date-panel-hint"></p></aside></div></div><div class="error" id="error" role="alert"></div></div>
<script>
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search);
document.documentElement.dataset.density=params.get('density')==='comfortable'?'comfortable':'compact';
const palette=['#3279c7','#bd4a69','#478d57','#b87527','#8058bc','#168d99','#c0523e','#6b7d27','#a33d9d','#5079a4','#aa7746','#318575','#865b49','#98547e','#567bb9','#a65b28','#658742','#8560aa','#b64e52','#3f8ba9','#8c7332','#4e9180','#b06b86','#636bb4'];
const names=t=>t.categories?.length?t.categories:[t.category||'Unsorted'];
function color(name){let hash=0;for(const char of name.toLowerCase())hash=(Math.imul(hash,31)+char.charCodeAt(0))>>>0;return palette[hash%palette.length]}
const dateOnly=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
window.addEventListener('message',event=>{
 if(parent===window||event.source!==parent||event.origin!==location.origin||event.data?.type!=='tether:snapshot-theme')return;
 const variables=event.data.variables||{};
 if(typeof variables.paper==='string')document.documentElement.style.setProperty('--calendar-task-base',variables.paper);
 if(typeof event.data.theme==='string')document.documentElement.dataset.theme=event.data.theme;
 for(const name of ['page','paper','panel','text','muted','line','soft','accent','accent-text','highlight']){
  if(typeof variables[name]==='string')document.documentElement.style.setProperty('--'+name,variables[name]);
 }
});

let restoringFocus=false;
let last=null,loadRevision=0,lastSignature='',selected=null,selectionRevision=0,returnTimer=null,lastInteraction=0,panelSignature='';
const dayLabel=date=>new Date(date+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
const allItems=data=>[...(data?.tasks||[]).map(task=>({task,activity:false})),...(data?.activity||[]).map(task=>({task,activity:true}))];
function notifyHeight(){if(parent!==window)parent.postMessage({type:'tether:snapshot-size',height:Math.ceil($('.shell').getBoundingClientRect().height)},location.origin)}
new ResizeObserver(notifyHeight).observe($('.shell'));
function scheduleReturn(){clearTimeout(returnTimer);if(!selected)return;lastInteraction=Date.now();returnTimer=setTimeout(()=>{selected=null;selectionRevision++;panelSignature='';renderPanel();markSelected()},15000)}
function markSelected(){for(const cell of document.querySelectorAll('.day'))cell.classList.toggle('selected',cell.dataset.date===(selected||dateOnly(new Date())))}
function selectDate(date){if(restoringFocus)return;if(selected!==date){selected=date;selectionRevision++;panelSignature='';renderPanel();markSelected()}scheduleReturn()}
function categoryLabels(parent,t){const span=document.createElement('span');span.className='task-categories';span.textContent=names(t).join(' · ');parent.append(span)}
function taskCard(t,activity=false,asButton=false,date=null){const item=document.createElement(asButton?'button':'article');item.className='task'+(activity?' activity':'');item.style.setProperty('--task-color',color(names(t)[0]));const title=document.createElement('span');title.className='task-title';title.textContent=activity?t.body:t.title;item.append(title);if(activity||t.schedule_label){const label=document.createElement('span');label.className='activity-label';label.textContent=activity?[t.title,t.kind].filter(Boolean).join(' · '):t.schedule_label;item.append(label)}categoryLabels(item,t);if(asButton){item.onclick=()=>selectDate(date);item.onfocus=()=>selectDate(date)}return item}
async function renderPanel(force=false){
 const date=selected||dateOnly(new Date()),request=++selectionRevision,panel=$('#date-panel'),items=$('#date-panel-items'),changed=panel.dataset.date!==date,oldScroll=changed?0:items.scrollTop;if(changed){items.textContent='Loading date…';items.scrollTop=0}panel.dataset.date=date;$('#date-panel-title').textContent=date===dateOnly(new Date())?'Today':new Date(date+'T12:00:00').toLocaleDateString(undefined,{weekday:'long'});$('#date-panel-date').textContent=dayLabel(date);$('#date-panel-hint').textContent=selected?'Returns to Today after 15 seconds of inactivity.':'';
 let data=(last?.days||[]).find(day=>day.date===date);
 if(!data){try{const query=new URLSearchParams({start:date,end:date});if(params.get('category'))query.set('category',params.get('category'));const response=await fetch('/api/snapshot?'+query);if(!response.ok)throw Error('Date details unavailable');const result=await response.json();data=result.days?.find(day=>day.date===date)||{date,tasks:[],activity:[]}}catch(_){if(request!==selectionRevision)return;panelSignature='';$('#date-panel-items').textContent='Could not load this date. It will retry on refresh.';return}}
 if(request!==selectionRevision)return;
 const signature=date+JSON.stringify(data);if(!force&&signature===panelSignature)return;panelSignature=signature;items.replaceChildren();for(const {task,activity} of allItems(data))items.append(taskCard(task,activity));if(!items.childElementCount){const empty=document.createElement('p');empty.className='date-panel-empty';empty.textContent='No scheduled items.';items.append(empty)}items.scrollTop=oldScroll;notifyHeight();
}
for(const event of ['pointerdown','pointermove','wheel','keydown','click'])$('#date-panel').addEventListener(event,e=>{if(selected&&(e.type!=='pointermove'||e.movementX||e.movementY))scheduleReturn()},{passive:true});
$('#date-panel-items').addEventListener('scroll',()=>{if(selected)scheduleReturn()},{passive:true});
function render(data){
 last=data;const signature=JSON.stringify(data)+dateOnly(new Date());if(signature===lastSignature){renderPanel();return}lastSignature=signature;
 const all=data.days||[],single=all.length===1,month=all.length>7,dashboard=params.get('layout')==='display',compact=month||dashboard;
 const weekends=all.some(d=>new Date(d.date+'T12:00:00').getDay()%6===0&&allItems(d).length);
 const cols=single?1:(compact||weekends)?7:5,weekStart=data.week_start??1,order=Array.from({length:7},(_,i)=>(weekStart+i)%7).filter(d=>cols===7||d>0&&d<6);
 const first=new Date(data.start+'T12:00:00'),end=new Date(data.end+'T12:00:00'),format=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
 $('#range').textContent=single?dayLabel(data.start):format(first)+' – '+format(end)+', '+end.getFullYear();
 const grid=$('#grid'),headers=$('#weekdays'),focused=document.activeElement,focusedCell=focused?.closest('.day'),focusDate=focusedCell?.dataset.date,focusIndex=focusedCell?[...focusedCell.querySelectorAll('button')].indexOf(focused):-1;grid.replaceChildren();headers.replaceChildren();$('.sheet').style.setProperty('--cols',cols);grid.className='grid '+(single?'single':month||dashboard?'month':'week');headers.hidden=single;
 for(const name of order.map(d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d])){const span=document.createElement('span');span.textContent=name;headers.append(span)}
 const begin=new Date(first),finish=new Date(end);if(!single){begin.setDate(begin.getDate()-(begin.getDay()-weekStart+7)%7);finish.setDate(finish.getDate()+6-(finish.getDay()-weekStart+7)%7)}
 const lookup=new Map(all.map(d=>[d.date,d]));
 for(let date=new Date(begin);date<=finish;date.setDate(date.getDate()+1)){
  if(cols===5&&(date.getDay()===0||date.getDay()===6))continue;
  const iso=dateOnly(date),d=lookup.get(iso),records=allItems(d),cell=document.createElement('div');cell.className='day'+(d?'':' outside')+(iso===dateOnly(new Date())?' today':'');cell.dataset.date=iso;
  const number=document.createElement('div');number.className='day-number';const dateButton=document.createElement('button');dateButton.className='day-date';dateButton.setAttribute('aria-controls','date-panel');dateButton.textContent=date.getDate();dateButton.setAttribute('aria-label',dayLabel(iso));dateButton.onclick=dateButton.onfocus=()=>selectDate(iso);number.append(dateButton);cell.append(number);
  cell.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')selectDate(iso)});cell.addEventListener('click',()=>selectDate(iso));
  const items=document.createElement('div');items.className='day-items';
  for(const {task,activity} of (compact?records.slice(0,3):records)){if(compact){const marker=document.createElement('button');marker.className='task-marker';marker.style.setProperty('--task-color',color(names(task)[0]));marker.style.setProperty('--marker-width',(65+(color(names(task)[0]).charCodeAt(2)%30))+'%');marker.setAttribute('aria-label',(activity?task.body:task.title)+' · '+dayLabel(iso));marker.onclick=marker.onfocus=()=>selectDate(iso);items.append(marker)}else items.append(taskCard(task,activity,true,iso))}cell.append(items);
  if(compact&&records.length>3){const more=document.createElement('button');more.className='day-more';more.textContent='+'+(records.length-3)+' more';more.setAttribute('aria-label','Show all '+records.length+' items on '+dayLabel(iso));more.onclick=more.onfocus=()=>selectDate(iso);cell.append(more)}grid.append(cell);
 }
 $('.sheet').style.setProperty('--rows',Math.max(1,Math.ceil(grid.childElementCount/cols)));markSelected();renderPanel();if(focusDate){const cell=[...grid.children].find(cell=>cell.dataset.date===focusDate),buttons=cell?.querySelectorAll('button');if(buttons?.length){restoringFocus=true;buttons[Math.min(Math.max(0,focusIndex),buttons.length-1)].focus({preventScroll:true});restoringFocus=false}}notifyHeight();
}
async function load(){const request=++loadRevision;try{const prefs=await fetch('/api/preferences').then(r=>r.ok?r.json():({week_start:1}));const monday=new Date();monday.setDate(monday.getDate()-(monday.getDay()-(prefs.week_start??1)+7)%7);const sunday=new Date(monday);sunday.setDate(sunday.getDate()+6);const query=new URLSearchParams({start:params.get('start')||dateOnly(monday),end:params.get('end')||dateOnly(sunday)});if(params.get('category'))query.set('category',params.get('category'));const response=await fetch('/api/snapshot?'+query);if(!response.ok)throw Error('Could not load this calendar');const data=await response.json();if(request!==loadRevision)return;render(data);$('#error').textContent=''}catch(e){if(request===loadRevision)$('#error').textContent=e.message}}
window.addEventListener('message',event=>{if(parent!==window&&event.source===parent&&event.origin===location.origin&&event.data?.type==='tether:snapshot-refresh')load()});
const refreshTimer=setInterval(()=>{if(!document.hidden)load()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(selected&&Date.now()-lastInteraction>=15000){selected=null;panelSignature=''}load()}});
window.addEventListener('pagehide',()=>{clearInterval(refreshTimer);clearTimeout(returnTimer);selectionRevision++;loadRevision++},{once:true});
load();
</script></html>
