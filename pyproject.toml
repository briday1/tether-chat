[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name; the application displays tether.
name = "tether-chat"
version = "2026.24"
description = "Local-first task and action-item assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "mcp>=1.2,<2",
  "keyring>=25,<27",
  "markdown-it-py>=3,<5",
  "nh3>=0.2,<1",
  "plyer>=2.1,<3",
  "psutil>=5.9,<8",
  "Pillow>=10,<13",
  "python-multipart>=0.0.18,<1",
]

[project.scripts]
"tether-chat" = "tether.cli:main"

[project.gui-scripts]
"tether-chat-desktop" = "tether.native:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
desktop = ["pywebview>=5,<7", "pystray>=0.19,<1"]

[tool.setuptools]
py-modules = ["tend"]

[tool.setuptools.packages.find]
include = ["tether*"]

[tool.setuptools.package-data]
tether = ["drive-config.json", "drive-sharing.html", "drive-sharing.mjs", "drive-sync-core.mjs", "drive-sync-service.mjs", "drive-journals.mjs", "drive-setup.mjs", "index.html", "board.html", "workspace.js", "display.html", "display.js", "display.css", "snapshot.html", "theme.css", "theme.js", "chat.js", "action-notes.js", "voice.js", "speech.mjs", "updates.js", "notes.js", "notes.css", "provider-models.js", "preferences.js", "locations.js", "tool-models.json", "favicon.svg", "manifest.webmanifest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
